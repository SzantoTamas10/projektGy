<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Digitális Kert — Projektek (Canvas virágok)</title>
<style>
:root{
  --bg-dark:#050508;
  --bg-darkgreen:#071205;
  --panel:rgba(255,255,255,0.04);
  --text-light:#E6FFE6;
  --muted:#9aa0a6;
  --accent:#6AA84F;
}
html,body{height:100%;margin:0;font-family:Inter,system-ui,Arial,sans-serif;background:var(--bg-dark);color:var(--text-light);overflow:hidden; cursor: default;}
.app { display:flex; height:100vh; width:100vw; }
.garden-wrap { position:relative; flex:1; min-width:320px; overflow:hidden; }
canvas#gardenCanvas { display:block; width:100%; height:100%; background: linear-gradient(180deg, rgba(255,255,255,0.02), transparent); cursor: pointer; }
header.appbar{ position:absolute; left:12px; top:12px; right:12px; display:flex; gap:12px; align-items:center; z-index:30; pointer-events:auto; }
.brand { font-weight:700; display:flex; gap:10px; align-items:center }
.logo { width:42px;height:42px;border-radius:8px;background:linear-gradient(135deg,var(--accent),#6c8ed5);display:flex;align-items:center;justify-content:center;font-weight:700 }
.controls { margin-left:auto; display:flex; gap:8px; align-items:center }
select, button, input[type="text"], input[type="password"]{ background:var(--panel); color:var(--text-light); border:1px solid rgba(255,255,255,0.03); padding:8px 10px; border-radius:8px; }
button { cursor:pointer; font-weight:600 }
aside.panel { width:380px; max-width:40%; min-width:300px; background: linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01)); border-left: 1px solid rgba(255,255,255,0.03); padding:18px; box-sizing:border-box; overflow:auto; display:flex; flex-direction:column; gap:12px; }
h2{margin:0 0 8px 0}
.meta{color:var(--muted); font-size:13px; margin-bottom:12px}
.tooltip { position:fixed; pointer-events:none; z-index:80; padding:8px 10px; border-radius:8px; background:rgba(0,0,0,0.7); color:var(--text-light); font-size:13px; box-shadow:0 6px 18px rgba(0,0,0,0.6); display:none; }
select#themeSelect option { color:#000; background:#fff; }
.login-popup { position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,0.8);padding:30px;border-radius:12px;display:none;z-index:100;}
.login-popup input { display:block;margin:8px 0;width:200px; }
.login-popup button { width:100%; }
.project-item{border:1px solid rgba(255,255,255,0.05);padding:6px;margin-bottom:6px;border-radius:6px;}
.project-item button{margin-top:4px;background:var(--accent);border:none;color:white;padding:4px 8px;border-radius:6px;cursor:pointer;}
.admin-section{display:flex;flex-direction:column;gap:6px;}
</style>
</head>
<body>

<div class="app">
  <div class="garden-wrap">
    <canvas id="gardenCanvas" aria-label="Digitális kert"></canvas>

    <header class="appbar">
      <div class="brand">
        <div class="logo">🌱</div>
        <div>Digitális Kert — Projektek</div>
      </div>
      <div class="controls">
        <label style="color:var(--muted); font-size:13px">Téma:</label>
        <select id="themeSelect" title="Téma">
          <option value="dark">Sötét</option>
          <option value="darkgreen">Sötét zöld</option>
        </select>
        <button id="loginBtn">Bejelentkezés</button>
      </div>
    </header>
  </div>

  <aside class="panel" id="controlPanel">
    <div id="messageSection">
      <input id="msgInput" type="text" placeholder="Írd ide az üzenetet..." style="width:70%;padding:6px;border-radius:6px;border:1px solid rgba(255,255,255,0.04);background:transparent;color:var(--text-light);"/>
      <button id="sendBtn" style="padding:6px 10px;border-radius:6px;background:var(--accent);border:none;color:white;cursor:pointer;">Küldés</button>
    </div>

    <div id="projectsSection">
      <h2>Vezérlőpanel</h2>
      <div class="meta">Kattints a virágokra, hogy az információ megjelenjen.</div>
      <div id="projectList"></div>

      <div id="adminControls" class="admin-section" style="display:none;">
        <input type="text" id="projectTitle" placeholder="Projekt neve"/>
        <input type="text" id="projectDesc" placeholder="Leírás"/>
        <input type="text" id="projectLink" placeholder="Link"/>
        <button id="addProjectBtn">Projekt hozzáadása</button>
      </div>
    </div>

    <div id="panelInfo" class="meta" style="margin-top:12px;">A virágokra kattintva jelenik meg a részlete.</div>
  </aside>
</div>

<div id="tooltip" class="tooltip"></div>

<div id="loginPopup" class="login-popup">
  <h3>Admin Bejelentkezés</h3>
  <input type="text" id="username" placeholder="Felhasználó"/>
  <input type="password" id="password" placeholder="Jelszó"/>
  <button id="doLoginBtn">Bejelentkezés</button>
</div>

<script>
// --------------------- NETLIFY BACKEND INTEGRÁCIÓ -------------------------

let flowers = []; // tömb üres, betöltés NETLIFY-ről lesz

async function loadProjects() {                                   // <-- NETLIFY API
  const res = await fetch('/.netlify/functions/projects');
  const data = await res.json();
  flowers = data;
  refreshProjectList();
}
loadProjects();

// ---------------------------- Canvas setup -------------------------------

const canvas = document.getElementById('gardenCanvas');
const ctx = canvas.getContext('2d');
function resizeCanvas(){ canvas.width = canvas.clientWidth; canvas.height = canvas.clientHeight; }
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

function drawFlower(f){
  const xc = f.x * canvas.width;
  const yc = f.y * canvas.height;
  const r = 30*f.scale;
  ctx.strokeStyle='#40FF80'; ctx.lineWidth=2;
  ctx.beginPath(); ctx.moveTo(xc,yc); ctx.lineTo(xc,yc+40*f.scale); ctx.stroke();
  for(let i=0;i<f.petals;i++){
    const angle = (i/f.petals)*2*Math.PI;
    ctx.beginPath();
    ctx.fillStyle=`hsl(${(f.hue+i*20)%360},100%,70%)`;
    ctx.ellipse(xc+Math.cos(angle)*r, yc+Math.sin(angle)*r, r*0.6, r*0.3, angle, 0, 2*Math.PI);
    ctx.fill();
  }
  ctx.beginPath(); ctx.fillStyle='#ff6'; ctx.arc(xc,yc,r*0.3,0,2*Math.PI); ctx.fill();
}

function drawAll(){
  ctx.fillStyle=document.documentElement.style.getPropertyValue('--bg-dark') || '#050508'; 
  ctx.fillRect(0,0,canvas.width,canvas.height);
  for(const f of flowers) drawFlower(f);
  requestAnimationFrame(drawAll);
}
drawAll();

// ---------------------------- Tooltip -----------------------------------

const tooltip = document.getElementById('tooltip');
const panelInfo = document.getElementById('panelInfo');

canvas.addEventListener('mousemove', e=>{
  const rect = canvas.getBoundingClientRect();
  const mx = e.clientX - rect.left;
  const my = e.clientY - rect.top;
  let found = null;
  for(const f of flowers){
    const xc = f.x*canvas.width, yc = f.y*canvas.height;
    if(Math.hypot(mx-xc,my-yc)<30*f.scale){ found=f; break; }
  }
  if(found){
    tooltip.style.display='block';
    tooltip.style.left = (e.clientX+12)+'px';
    tooltip.style.top = (e.clientY+12)+'px';
    tooltip.textContent = found.title;
  }else tooltip.style.display='none';
});

// --------------------------- Klikk (admin) ------------------------------

let loggedIn = false;

canvas.addEventListener('click', e=>{
  if(!loggedIn) return;
  const rect = canvas.getBoundingClientRect();
  const mx = e.clientX-rect.left;
  const my = e.clientY-rect.top;
  for(const f of flowers){
    const xc = f.x*canvas.width, yc = f.y*canvas.height;
    if(Math.hypot(mx-xc,my-yc)<30*f.scale){
      panelInfo.innerHTML=`<strong>${f.title}</strong><br>${f.desc}<br><a href="${f.link}" target="_blank">Megnyitás</a>`;
      break;
    }
  }
});

// ---------------------------- Üzenet küldés ------------------------------

document.getElementById('sendBtn').addEventListener('click', ()=>{
  const msg = document.getElementById('msgInput').value.trim();
  if(!msg) return alert('Írj be üzenetet!');
  window.location.href = `mailto:szanigyak98@gmail.com?subject=Digitális Kert&body=${encodeURIComponent(msg)}`;
});

// ----------------------------- Téma váltó -------------------------------

const themeSelect = document.getElementById('themeSelect');
themeSelect.addEventListener('change', ()=>{
  const val = themeSelect.value;
  if(val==='darkgreen'){
    document.documentElement.style.setProperty('--bg-dark','#071205');
    document.documentElement.style.setProperty('--panel','rgba(0,0,0,0.06)');
  }else{
    document.documentElement.style.setProperty('--bg-dark','#050508');
    document.documentElement.style.setProperty('--panel','rgba(255,255,255,0.04)');
  }
});

// ------------------------------- Admin ----------------------------------

const loginPopup = document.getElementById('loginPopup');
const loginBtn = document.getElementById('loginBtn');
const adminControls = document.getElementById('adminControls');
const projectListDiv = document.getElementById('projectList');

loginBtn.addEventListener('click', ()=>{
  if(loggedIn){
    loggedIn=false;
    loginBtn.textContent='Bejelentkezés';
    adminControls.style.display='none';
    refreshProjectList();
  } else {
    loginPopup.style.display='block';
  }
});

function loginAction(){
  const u = document.getElementById('username').value;
  const p = document.getElementById('password').value;
  if(u==='admin' && p==='admin'){
    loggedIn=true;
    loginPopup.style.display='none';
    loginBtn.textContent='Kijelentkezés';
    adminControls.style.display='flex';
    refreshProjectList();
  } else alert('Hibás felhasználó/jelszó!');
}

document.getElementById('username').addEventListener('keypress', e=>{ if(e.key==='Enter') loginAction(); });
document.getElementById('password').addEventListener('keypress', e=>{ if(e.key==='Enter') loginAction(); });
document.getElementById('doLoginBtn').addEventListener('click', loginAction);

// ---------------------- PROJEKT HOZZÁADÁSA (NETLIFY) ---------------------

async function addProject(title, desc, link) {                    // <-- NETLIFY API
  const newFlower = {
    title,
    desc,
    link,
    x: Math.random()*0.8 + 0.1,
    y: Math.random()*0.6 + 0.2,
    scale: 1,
    hue: Math.floor(Math.random()*360),
    petals: Math.floor(Math.random()*3)+5
  };

  const res = await fetch('/.netlify/functions/projects', {
    method: 'POST',
    body: JSON.stringify(newFlower)
  });

  const saved = await res.json();
  flowers.push(saved);
  refreshProjectList();
}

document.getElementById('addProjectBtn').addEventListener('click', ()=>{
  if(!loggedIn) return alert('Be kell jelentkezned!');
  const title = document.getElementById('projectTitle').value.trim();
  const desc = document.getElementById('projectDesc').value.trim();
  const link = document.getElementById('projectLink').value.trim();
  if(!title || !link) return alert('Adj meg címet és linket!');
  addProject(title, desc, link);
});

// ---------------------- PROJEKT TÖRLÉSE (NETLIFY) -----------------------

async function deleteProject(id) {                                 // <-- NETLIFY API
  await fetch('/.netlify/functions/projects', {
    method: 'DELETE',
    body: JSON.stringify({ id })
  });

  flowers = flowers.filter(f => f.id !== id);
  refreshProjectList();
}

// -------------------------- LISTA FRISSÍTÉS -----------------------------

function refreshProjectList(){
  projectListDiv.innerHTML='';
  flowers.forEach(f=>{
    const div = document.createElement('div');
    div.className='project-item';
    div.innerHTML=`<strong>${f.title}</strong><br>${f.desc}<br><a href="${f.link}" target="_blank">Link</a>`;
    
    if(loggedIn){
      const delBtn = document.createElement('button');
      delBtn.textContent='Törlés';
      delBtn.onclick=()=> deleteProject(f.id);
      div.appendChild(delBtn);
    }
    
    projectListDiv.appendChild(div);
  });
}

</script>
</body>
</html>
