<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>404 — Pac-Man írja</title>
<style>
html, body {
  height:100%; margin:0; background:#000; color:#ffd400;
  font-family:system-ui,sans-serif; overflow:hidden;
}
/* ÚJ RÉTEGZÉS: A text canvas a legfelső réteg, Pac-Man alá (a game canvas-ra) kerül a szöveg. */
canvas {display:block; position:absolute; inset:0;}
#wrap {position:fixed; inset:0;}
#watch {
  position:absolute;
  top:10px;
  left:10px;
  width:clamp(150px, 25vw, 250px);
  height:clamp(150px, 25vw, 250px);
  border:1px solid #28d1fa;
}
#limited {
  position:absolute;
  top:10px;
  right:10px;
  color:#28d1fa;
  font-family:Comic Sans MS, cursive;
  font-weight:bold;
  font-size:clamp(12px, 2vw, 18px);
}
/* Reszponzív tipográfia */
.error-text {
  font-size: clamp(1rem, 4vw, 2.5rem);
  font-weight: 300;
}
#scoreboard {
  position: absolute;
  bottom: 10px;
  left: 10px;
  color: #ffd400;
  font-family: system-ui, sans-serif;
  font-size: clamp(14px, 3vw, 22px);
  font-weight: bold;
}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="bg"></canvas>
  <canvas id="text"></canvas> <canvas id="game"></canvas> <canvas id="watch" width="500" height="500"></canvas>
  <div id="limited">limited edition</div>
  <div id="scoreboard">SCORE: 0</div>
</div>

<script>
// === Alap ===
const bgCanvas=document.getElementById('bg');
const textCanvas=document.getElementById('text'); // ÚJ CANVAS
const gameCanvas=document.getElementById('game');
const bgCtx=bgCanvas.getContext('2d');
const textCtx=textCanvas.getContext('2d'); // ÚJ CONTEXT
const ctx=gameCanvas.getContext('2d'); // Pac-Man context
let W,H,scale,fontSize,lineHeight;
const lines=["404 error","page is not found"];
let score=0;
const scoreboard=document.getElementById('scoreboard');

// ÚJ VÁLTOZÓK: A szellemek késleltetett újraéledéséhez
let ghostsEaten = 0; // Megmutatja, hány szellem vár újraéledésre
let respawnCooldown = 0;
const RESPAWN_TIME = 120; // 2 másodperc (60 kép/másodperc mellett)

const GHOST_RADIUS = 12; // Szellem sugara

// Pac-Man méretfaktorok:
const PAC_R_WRITING_FACTOR = 0.45; 
const PAC_R_FREE_SIZE = GHOST_RADIUS; 


function resize(){
  const ratio=window.devicePixelRatio||1;
  W=window.innerWidth; H=window.innerHeight;
  // VÁLTOZÁS: textCanvas hozzáadva
  [bgCanvas,textCanvas,gameCanvas].forEach(c=>{
    c.width=Math.floor(W*ratio);
    c.height=Math.floor(H*ratio);
    c.style.width=W+'px';
    c.style.height=H+'px';
  });
  bgCtx.setTransform(ratio,0,0,ratio,0,0);
  textCtx.setTransform(ratio,0,0,ratio,0,0); // ÚJ
  ctx.setTransform(ratio,0,0,ratio,0,0);
  scale=Math.min(W/900,H/400); 
  fontSize=Math.floor(Math.min(W*0.08,H*0.2));
  lineHeight=fontSize*1.2;
}

window.addEventListener('resize',()=>{resize();preparePositions();});
resize();

// === Csillag háttér ===
let stars = Array.from({length:80},()=>({
  x:Math.random()*W,
  y:Math.random()*H,
  r:Math.random()*2+1,
  tw:Math.random()*100
}));

// === Szellemek ===
const ghostColors=['#ff0000','#00ffde','#ffb8ff','#ffb847'];
let ghosts=[];
/**
 * Létrehoz egy új szellemet, véletlenszerű pozícióban.
 */
function spawnGhost(){
  const c=ghostColors[Math.floor(Math.random()*ghostColors.length)];
  let x = Math.random()*W;
  let y = Math.random()*H/2+50;
  ghosts.push(
    {x,y,vx:(Math.random()<0.5?-1:1)*(0.5+Math.random()),vy:(Math.random()<0.5?-1:1)*(0.5+Math.random()),color:c}
  );
}
/**
 * Létrehoz egy megadott számú szellemet (alapértelmezésben 4-et).
 */
function spawnGhosts(count = 4){ 
  ghosts=[];
  for(let i=0;i<count;i++) spawnGhost();
}
spawnGhosts(); // 4 szellemmel indul

function drawGhost(g){
  // GHOST_RADIUS (12) konstans használata
  bgCtx.beginPath();
  bgCtx.arc(g.x,g.y,GHOST_RADIUS,Math.PI,0,false);
  bgCtx.lineTo(g.x+GHOST_RADIUS,g.y+GHOST_RADIUS);
  bgCtx.lineTo(g.x+6,g.y+8);
  bgCtx.lineTo(g.x,g.y+GHOST_RADIUS);
  bgCtx.lineTo(g.x-6,g.y+8);
  bgCtx.lineTo(g.x-GHOST_RADIUS,g.y+GHOST_RADIUS);
  bgCtx.closePath();
  bgCtx.fillStyle=g.color;
  bgCtx.fill();
  bgCtx.fillStyle='#fff';
  bgCtx.beginPath();
  bgCtx.arc(g.x-5,g.y-2,3,0,Math.PI*2);
  bgCtx.arc(g.x+5,g.y-2,3,0,Math.PI*2);
  bgCtx.fill();
  bgCtx.fillStyle='#000';
  bgCtx.beginPath();
  bgCtx.arc(g.x-5,g.y-2,1.5,0,Math.PI*2);
  bgCtx.arc(g.x+5,g.y-2,1.5,0,Math.PI*2);
  bgCtx.fill();
}

function updateBackground(){
  bgCtx.clearRect(0,0,W,H);
  stars.forEach(s=>{
    s.tw+=0.05;
    let a=0.5+Math.sin(s.tw)*0.5;
    bgCtx.fillStyle=`rgba(255,255,255,${a})`;
    bgCtx.beginPath();
    bgCtx.arc(s.x,s.y,s.r,0,Math.PI*2);
    bgCtx.fill();
  });
  ghosts.forEach(g=>{
    g.x+=g.vx; g.y+=g.vy;
    // Szellemek pattannak a falról a teljes képernyőn
    if(g.x<20||g.x>W-20) g.vx*=-1;
    if(g.y<20||g.y>H-20) g.vy*=-1;
    drawGhost(g);
  });
}

// === Pac-Man és szöveg ===
const pac={x:0,y:0,r:0,vx:3,mouth:0,angle:0}; 
let lastTime=0,charIndex=0,lineIndex=0,positions=[],finished=false;

function preparePositions(){
  // VÁLTOZÁS: textCtx használata
  textCtx.font=`300 ${fontSize}px system-ui, sans-serif`;
  textCtx.textBaseline='middle'; textCtx.textAlign='left';
  positions=[];
  const totalHeight=lineHeight*lines.length;
  lines.forEach((line,i)=>{
    let y=H/2-totalHeight/2+i*lineHeight+lineHeight/2;
    // VÁLTOZÁS: textCtx használata
    let x=(W-textCtx.measureText(line).width)/2;
    let linePos=[];
    for(let j=0;j<line.length;j++){
      // VÁLTOZÁS: textCtx használata
      let w=textCtx.measureText(line.slice(0,j+1)).width;
      linePos.push({char:line[j],x:x+w,y});
    }
    positions.push(linePos);
  });
}

function drawText(){
  textCtx.clearRect(0,0,W,H); // Törli az új szöveges vásznat
  textCtx.fillStyle='#ffd400';
  textCtx.font=`300 ${fontSize}px system-ui, sans-serif`;
  textCtx.textBaseline='middle'; textCtx.textAlign='left';
  const totalHeight=lineHeight*lines.length;
  lines.forEach((line,i)=>{
    let x=(W-textCtx.measureText(line).width)/2;
    let y=H/2-totalHeight/2+i*lineHeight+lineHeight/2;
    let visible=positions[i].filter((p,idx)=> idx<(i<lineIndex?positions[i].length:(i===lineIndex?charIndex:0)));
    // VÁLTOZÁS: textCtx használata
    textCtx.fillText(visible.map(p=>p.char).join(''),x,y);
  });
  textCtx.textAlign='left'; textCtx.textBaseline='top';
  textCtx.font=`bold ${fontSize*0.2}px Comic Sans MS, cursive`;
  textCtx.fillText('sorry',10,10);
}

function drawPac(x,y,r,angle){
  // r itt a pac.r * scale, azaz a képernyő pixel méret
  const mouthOpen=0.25+0.15*Math.abs(Math.sin(pac.mouth));
  const start=angle+mouthOpen;
  const end=angle-mouthOpen;
  ctx.beginPath(); ctx.moveTo(x,y);
  ctx.arc(x,y,r,start,end,false);
  ctx.closePath();
  ctx.fillStyle='#ffd400'; ctx.fill();
  const eyeAngle = angle - Math.PI/2;
  const eyeX = x + Math.cos(eyeAngle) * r * 0.5;
  const eyeY = y + Math.sin(eyeAngle) * r * 0.5;
  ctx.beginPath();
  ctx.arc(eyeX,eyeY,r*0.18,0,Math.PI*2);
  ctx.fillStyle='#fff'; ctx.fill();
  ctx.beginPath();
  ctx.arc(eyeX,eyeY,r*0.08,0,Math.PI*2);
  ctx.fillStyle='#000'; ctx.fill();
}


// === Pontszám popup ===
let scorePopups = [];

function eatGhostCheck() {
  ghosts = ghosts.filter(g => {
    const pacR_scaled = pac.r * scale; 
    const d = Math.hypot(g.x - pac.x, g.y - pac.y);
    if (d < pacR_scaled + 10) {
      score+=100;
      scoreboard.textContent="SCORE: "+score;
      scorePopups.push({x: g.x, y: g.y, text: "+100", life: 60});
      
      // MÓDOSÍTÁS: Növeljük a megevett szellemek számlálóját
      ghostsEaten++; 
      return false; // Eltávolítjuk a szellemet a tömbből
    }
    return true; 
  });
}

function drawPopups() {
  ctx.font = `bold ${fontSize * 0.3}px system-ui, sans-serif`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  scorePopups.forEach(p => {
    ctx.fillStyle = `rgba(255,212,0,${p.life/60})`;
    ctx.fillText(p.text, p.x, p.y - (60 - p.life) * 0.5);
    p.life--;
  });
  scorePopups = scorePopups.filter(p => p.life > 0);
}

// === Drift szög interpoláció ===
function lerpAngle(a, b, t) {
  let diff = b - a;
  while (diff > Math.PI) diff -= 2 * Math.PI;
  while (diff < -Math.PI) diff += 2 * Math.PI;
  return a + diff * t;
}

function animate(t){
  const dt=(t-lastTime)/16.666; lastTime=t;
  updateBackground();
  ctx.clearRect(0,0,W,H); // Törli Pac-Man vásznát
  drawText(); // A szöveg a text vászonra kerül

  pac.mouth+=0.1;

  // Pac-Man sugár beállítása a fázisnak megfelelően
  const targetRadius = finished ? PAC_R_FREE_SIZE : (fontSize * PAC_R_WRITING_FACTOR);
  pac.r = targetRadius / scale; 
  
  const START_OFFSET_X = 50;
  
  const maxW = W; 
  const maxH = H;
  const pacR_scaled = pac.r * scale; // Pac-Man sugár a valós pixelméretben


  if(!finished){
    // ... író animáció ...
    pac.x+=pac.vx; 
    
    if(lineIndex<positions.length){
      if(charIndex<positions[lineIndex].length){
        if(pac.x>=positions[lineIndex][charIndex].x) charIndex++;
      } else {
        lineIndex++; charIndex=0;
        if(lineIndex<positions.length){
          // Kezdőpozíció
          pac.x=positions[lineIndex][0].x-START_OFFSET_X;
          pac.y=positions[lineIndex][0].y;
        } else finished=true;
      }
    }
  } else { // Szabad mozgás
    
    eatGhostCheck(); 
    
    // VÁLTOZÁS: Késleltetett újraéledési mechanizmus
    if (ghostsEaten > 0) {
        respawnCooldown++;
        if (respawnCooldown >= RESPAWN_TIME) {
            spawnGhost();
            ghostsEaten--;
            respawnCooldown = 0;
        }
    }
    
    let isMoving = true;
    const moveSpeed = 2.2; 
    let targetAngle;
    
    let nearest=null,dist=Infinity;
    ghosts.forEach(g=>{
      const d=Math.hypot(g.x-pac.x,g.y-pac.y);
      if(d<dist){dist=d; nearest=g;}
    });

    if(nearest){
        // CHASE LOGIC (Szellemek üldözése)
        targetAngle=Math.atan2(nearest.y-pac.y,nearest.x-pac.x);
    } else {
        // PATROL LOGIC (Ha nincs szellem, tartja az irányt, vagy pattan a falról)
        // Ez a blokk csak akkor fut le, ha a ghosts tömb üres, vagy ha van szellem, de túl messze van.
        
        const currentAngle = pac.angle;
        let newAngle = currentAngle;

        // Visszapattanás logikája a teljes képernyőn
        if (pac.x <= pacR_scaled || pac.x >= maxW - pacR_scaled) {
            newAngle = Math.PI - currentAngle; 
        }
        
        if (pac.y <= pacR_scaled || pac.y >= maxH - pacR_scaled) {
            newAngle = -currentAngle; 
        }
        
        targetAngle = newAngle;
        
        // Ha épp falnak ütközött, azonnali szögváltás.
        if (pac.x <= pacR_scaled || pac.x >= maxW - pacR_scaled || pac.y <= pacR_scaled || pac.y >= maxH - pacR_scaled) {
            pac.angle = targetAngle;
        } else {
            // Ha nem ütközik falnak, megtartja az irányt.
            targetAngle = pac.angle; 
        }
    }
    
    // Szög interpoláció (ívben fordulás) és mozgás
    if (isMoving && targetAngle !== undefined) {
        pac.angle = lerpAngle(pac.angle, targetAngle, 0.1 * dt); 

        // MOZGÁS
        pac.x+=Math.cos(pac.angle)*moveSpeed*scale;
        pac.y+=Math.sin(pac.angle)*moveSpeed*scale;
    }
    
    // Határellenőrzés (a falon belül tartás)
    if(pac.x<pacR_scaled) pac.x=pacR_scaled;
    if(pac.y<pacR_scaled) pac.y=pacR_scaled;
    if(pac.x>maxW-pacR_scaled) pac.x=maxW-pacR_scaled;
    if(pac.y>maxH-pacR_scaled) pac.y=maxH-pacR_scaled;
  }

  drawPopups();
  drawPac(pac.x,pac.y,pacR_scaled,pac.angle); 

  renderClock();
  requestAnimationFrame(animate);
}

function init(){
  preparePositions();
  
  // Kezdő sugár beállítása
  const initialR = (fontSize * PAC_R_WRITING_FACTOR); 
  pac.r = initialR;
  
  // Kezdő pozíció: A szöveg kezdőpontja
  pac.x=positions[0][0].x-50;
  pac.y=positions[0][0].y;
  
  pac.angle=0;
  charIndex=0; lineIndex=0; finished=false;
  lastTime=performance.now();
  
  // Reseteljük a számlálókat indításkor
  ghostsEaten = 0;
  respawnCooldown = 0;

  requestAnimationFrame(animate);
}
preparePositions(); init();

// === Óra ===
const watchCanvas=document.getElementById('watch');
const wctx=watchCanvas.getContext('2d');
const watchSize=500,displaySize=250,factor=displaySize/watchSize;
wctx.strokeStyle='#28d1fa'; wctx.lineWidth=17*factor; wctx.lineCap='round'; wctx.shadowColor='#28d1fa'; wctx.shadowBlur=15*factor;

function degToRad(d){return d*Math.PI/180;}
function renderClock(){
  let now=new Date();
  let today=now.toDateString();
  let time=now.toLocaleTimeString();
  let h=now.getHours(),m=now.getMinutes(),s=now.getSeconds(),ms=now.getMilliseconds();
  
  // Simított időszámítás
  let sec=s+ms/1000;
  let smoothM = m + sec / 60; // Simított perc
  let smoothH = h + smoothM / 60; // Simított óra (24h)
  
  wctx.fillStyle='#000'; wctx.fillRect(0,0,watchSize,watchSize);
  wctx.globalAlpha = 0.5;
  
  // Óra (24 órás skála)
  wctx.beginPath(); wctx.arc(250,250,200,degToRad(270),degToRad(smoothH*15-90)); wctx.stroke();
  
  // Perc
  wctx.beginPath(); wctx.arc(250,250,170,degToRad(270),degToRad(smoothM*6-90)); wctx.stroke();

  // Másodperc
  wctx.beginPath(); wctx.arc(250,250,140,degToRad(270),degToRad(sec*6-90)); wctx.stroke();
  
  wctx.globalAlpha = 1;
  wctx.font=`bold 35px system-ui, sans-serif`; 
  wctx.fillStyle='#28d1fa';
  
  // Középre igazítás
  wctx.textAlign = 'center'; 
  
  wctx.fillText(today, 250, 235);
  wctx.fillText(time, 250, 280);
  
  wctx.textAlign = 'left'; 
}
</script>
</body>
</html>
