<!doctype html>
<html lang="hu">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>404 — Pac‑Man írja</title>
  <style>
    html,body{height:100%;margin:0;background:#000;color:#ffd400;font-family:system-ui,sans-serif;}
    canvas{display:block;width:100%;height:100%}
    #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
  </style>
</head>
<body>
<div id="wrap">
  <canvas id="c"></canvas>
</div>
<script>
const lines = ["404 error", "page is not found"]; 
const canvas = document.getElementById('c'); 
const ctx = canvas.getContext('2d'); 

let W, H, scale, fontSize, lineHeight; 
function resize(){
  const ratio = window.devicePixelRatio || 1;
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = Math.floor(W * ratio);
  canvas.height = Math.floor(H * ratio);
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(ratio,0,0,ratio,0,0);
  scale = Math.min(W/900, H/400);
  fontSize = Math.floor(Math.min(W*0.1, H*0.25));
  lineHeight = fontSize * 1.2;
}

const pac = {x:0, y:0, r:28, vx:3, mouth:0}; 
let lastTime = 0; 
let charIndex = 0; 
let lineIndex = 0; 
let positions = []; 
let finished = false; 

function preparePositions(){
  ctx.font = `bold ${fontSize}px system-ui, sans-serif`; 
  ctx.textBaseline = 'middle'; 
  ctx.textAlign = 'left'; 

  positions = []; 
  const totalHeight = lineHeight * lines.length; 
  lines.forEach((line,i)=>{
    let y = H/2 - totalHeight/2 + i*lineHeight + lineHeight/2; 
    let x = (W - ctx.measureText(line).width)/2; 
    let linePositions = [];
    for(let j=0;j<line.length;j++){
      const ch = line[j]; 
      const w = ctx.measureText(line.slice(0,j+1)).width; 
      linePositions.push({char:ch, x: x + w, y}); 
    }
    positions.push(linePositions); 
  });
}

function drawText(){
  ctx.fillStyle = '#ffd400'; 
  ctx.font = `bold ${fontSize}px system-ui, sans-serif`; 
  ctx.textBaseline = 'middle'; 
  ctx.textAlign = 'left';
  const totalHeight = lineHeight * lines.length; 
  lines.forEach((line,i)=>{
    let y = H/2 - totalHeight/2 + i*lineHeight + lineHeight/2; 
    let x = (W - ctx.measureText(line).width)/2; 
    let visibleChars = positions[i].filter((p, idx)=> idx < (i<lineIndex ? positions[i].length : (i===lineIndex ? charIndex : 0)));
    let textToDraw = visibleChars.map(p=>p.char).join(''); 
    ctx.fillText(textToDraw, x, y); 
  });
}

function drawPac(x,y,r){
  const mouthOpen = 0.15 + 0.15 * Math.abs(Math.sin(pac.mouth)); 
  const start = mouthOpen * Math.PI; 
  const end = -mouthOpen * Math.PI; 
  ctx.beginPath();
  ctx.moveTo(x,y);
  ctx.arc(x,y,r,start,end,false); 
  ctx.closePath();
  ctx.fillStyle = '#ffd400';
  ctx.fill(); 
  ctx.beginPath();
  ctx.arc(x, y-r*0.35, r*0.14, 0, Math.PI*2); 
  ctx.fillStyle = '#000';
  ctx.fill();
}

function animate(t){
  const dt = (t - lastTime)/16.666; 
  lastTime = t;
  if(!finished){
    pac.mouth += dt*0.35; 
    pac.x += pac.vx*scale*dt; 

    if(lineIndex < positions.length){
      if(charIndex < positions[lineIndex].length){
        const nextPos = positions[lineIndex][charIndex]; 
        if(pac.x >= nextPos.x){
          charIndex++; 
        }
      } else {
        lineIndex++; 
        charIndex = 0;
        if(lineIndex < positions.length){
          pac.x = positions[lineIndex][0].x - 50; 
          pac.y = positions[lineIndex][0].y;
        } else {
          finished = true; 
        }
      }
    } else {
      finished = true; 
    }
  }

  ctx.clearRect(0,0,W,H); 
  drawText(); 

  // Bal felső sarok - "sorry"
ctx.textAlign = 'left';
ctx.textBaseline = 'top';
ctx.font = `bold ${fontSize*0.2}px Comic Sans MS, cursive`; // kisebb, kézírásos
ctx.fillStyle = '#ffd400';
ctx.fillText('sorry', 10, 10);

// Jobb felső sarok - "limited edition"
ctx.textAlign = 'right';
ctx.textBaseline = 'top';
ctx.font = `bold ${fontSize*0.2}px Comic Sans MS, cursive`; // kisebb, kézírásos
ctx.fillStyle = '#ffd400';
ctx.fillText('limited edition', W - 10, 10);


  if(!finished){
    pac.y = positions[lineIndex][0].y;
    drawPac(pac.x, pac.y, pac.r*scale); 
  } else {
    // Pac-Man a szöveg alatt, távolság fele a sorok közötti távolságnak
    const totalHeight = lineHeight * lines.length;
    const finalY = H/2 - totalHeight/2 + lines.length*lineHeight + lineHeight/2;
    const finalX = W/2;
    drawPac(finalX, finalY, pac.r*scale); 
  }

  requestAnimationFrame(animate); 
}

function init(){
  resize(); 
  preparePositions(); 
  pac.x = positions[0][0].x - 50; 
  pac.y = positions[0][0].y;
  pac.r = 28; 
  pac.vx = 3; 
  charIndex = 0; 
  lineIndex = 0;
  finished = false; 
  lastTime = performance.now();
  requestAnimationFrame(animate); 
}

window.addEventListener('resize', ()=>{
  resize(); 
  preparePositions(); 
});

resize();
preparePositions();
init(); 
</script>
</body>
</html>
